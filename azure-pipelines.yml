trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  - script: dotnet restore GiftOfTheGivers.slnx
    displayName: 'Restore NuGet packages'

  - script: dotnet build GiftOfTheGivers.slnx --configuration Release --no-restore
    displayName: 'Build solution'

  - script: dotnet test GiftOfTheGivers.slnx --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
    displayName: 'Run automated tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)\TestResults\*.trx'
      failTaskOnFailedTests: true
      testRunTitle: 'Gift of the Givers Automated Tests'